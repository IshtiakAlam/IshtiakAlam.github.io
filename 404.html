<style>

  :root[data-theme="dark"] { --bg: #1C1C1C; --text: #F4F4F4; --body: #D4C5B0; --num: #BFA181; color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font-family: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif; line-height: 1.6;
    padding: env(safe-area-inset-top, 0px) 1.5rem env(safe-area-inset-bottom, 0px);
  }
  main { max-width: 34rem; }
  .code { margin: 0; font-size: clamp(4rem, 3rem + 6vw, 7rem); font-weight: 820; font-stretch: 125%; color: var(--num); line-height: 1; letter-spacing: -.04em; }

  a:focus-visible { outline: 2px solid var(--num); outline-offset: 3px; }
</style>
</head>
